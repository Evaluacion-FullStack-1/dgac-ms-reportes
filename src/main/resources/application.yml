server:
  port: ${PORT:8090}

spring:
  application:
    name: dgac-ms-reportes
    
  # Conexión a base de datos Neon
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-young-thunder-aq0arqn7-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_0VRNzvtkyf8H}
    driver-class-name: org.postgresql.Driver
    
  # JPA y Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

# Configuración de integración
incidencias:
  base-url: http://DGAC-MS-INCIDENCIAS

# Configuración de Eureka (Indispensable para el ecosistema)
eureka:
  instance:
    hostname: localhost
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8080/eureka/}